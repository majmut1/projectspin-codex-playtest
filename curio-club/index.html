const save=()=>localStorage.setItem(K,JSON.stringify(S)),today=()=>new Date().toDateString(),toast=x=>{T.textContent=x;T.classList.add('show');setTimeout(()=>T.classList.remove('show'),1500)},beep=(f=600)=>{if(!S.sound)return;try{let c=beep.c||(beep.c=new AudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.stop(c.currentTime+.14)}catch{}},win=(id,n=2)=>{S.stars+=n;S.hi[id]=Math.max(S.hi[id]||0,n);save();beep(850);toast('⭐'.repeat(n)+' earned!')},go=f=>{clean();clean=()=>{};scrollTo(0,0);f()},top=()=>`<div class=top><div class=logo>🔎 Curio Club</div><button class=round id=sound>${S.sound?'🔊':'🔇'}</button><button class=round id=full>⛶</button></div>`,wireTop=()=>{let s=document.getElementById('sound');if(s)s.onclick=()=>{S.sound=!S.sound;save();s.textContent=S.sound?'🔊':'🔇'};let f=document.getElementById('full');if(f)f.onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()},head=(t,p,sc='')=>`<div class=head><button class=back>←</button><div><h1>${t}</h1><p>${p}</p></div>${sc?`<span class=score>${sc}</span>`:''}</div>`,wireBack=()=>document.querySelector('.back').onclick=()=>go(home),modal=h=>{let b=document.createElement('div');b.className='modalbg';b.innerHTML=`<div class=modal>${h}<p><button class="btn blue close">Close</button></p></div>`;document.body.appendChild(b);b.querySelector('.close').onclick=()=>b.remove();return b},drag=(e,b)=>{let on=0,dx=0,dy=0;e.onpointerdown=q=>{on=1;e.setPointerCapture(q.pointerId);let r=e.getBoundingClientRect();dx=q.clientX-r.left;dy=q.clientY-r.top};e.onpointermove=q=>{if(!on)return;let r=b.getBoundingClientRect();e.style.left=Math.max(0,Math.min(r.width-e.offsetWidth,q.clientX-r.left-dx))+'px';e.style.top=Math.max(0,Math.min(r.height-e.offsetHeight,q.clientY-r.top-dy))+'px'};e.onpointerup=()=>on=0};
function home(){A.innerHTML=`<main class=screen>${top()}<section class=hero><div class=panel><div class=ey>Curiosity in every corner</div><h1>Play. Make.<br>Discover!</h1><p>Choose an adventure, experiment, and fill your collection.</p><button class=btn id=random>🎲 Surprise me</button><div class=kid>🧑‍🔬</div></div><button class="panel gift" id=gift><div class=ey>Daily discovery</div><h2>${S.gift===today()?'Come back tomorrow!':'A surprise is ready!'}</h2><div class=big>${S.gift===today()?'✅':'🎁'}</div></button></section><section class=section><div class=title><span>Choose an adventure</span><span class=pill>⭐ ${S.stars}</span></div><div class=grid>${G.map(g=>`<button class=card data-g=${g[0]}><span class=stars>${'⭐'.repeat(S.hi[g[0]]||0)||'NEW'}</span><i>${g[1]}</i><b>${g[2]}</b><small>${g[3]}</small></button>`).join('')}</div></section><nav class=dock><button id=watch><span>▶️</span>WATCH</button><button id=call><span>📞</span>CALL</button><button id=coll><span>🏆</span>COLLECT</button><button id=parents><span>⚙️</span>PARENTS</button></nav></main>`;wireTop();document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>launch(b.dataset.g));random.onclick=()=>launch(G[Math.floor(Math.random()*G.length)][0]);gift.onclick=giftOpen;watch.onclick=()=>go(watchRoom);call.onclick=()=>go(callRoom);coll.onclick=collection;parents.onclick=parentsRoom}
function giftOpen(){if(S.gift===today())return toast('Already opened today!');let lock=C.map((_,i)=>i).filter(i=>!S.un.includes(i)),i=lock.length?lock[Math.floor(Math.random()*lock.length)]:0;S.un.push(i);S.gift=today();S.stars+=2;save();beep(900);let m=modal(`<div style="font-size:90px">${C[i][0]}</div><div class=ey>New discovery</div><h2>${C[i][1]}</h2><p>Added to your collection + ⭐⭐</p>`);m.querySelector('.close').onclick=()=>{m.remove();home()}}

function sink(){let items=[['🦆','Duck','float'],['🪨','Rock','sink'],['🍋','Lemon','float'],['🔑','Key','sink'],['🥄','Spoon','sink'],['🍎','Apple','float']],r=0,s=0,c;function next(){if(r===5){win('sink',s>=4?3:2);return setTimeout(sink,1200)}c=items[Math.floor(Math.random()*items.length)];document.querySelector('.obj').className='obj';document.querySelector('.obj').textContent=c[0];document.getElementById('nm').textContent=c[1];document.getElementById('res').textContent='What do you think?'}shell('Sink or Float','Predict what happens',`<div class=note>Will it sink or float?</div><div class="stage tank"><div class=obj></div></div><h2 id=nm style="text-align:center"></h2><div class=choices><button class=choice data-a=sink>⬇️ SINK</button><button class="choice orange" data-a=float>🌊 FLOAT</button></div><div class=result id=res>What do you think?</div>`,'0 / 5');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let ok=b.dataset.a===c[2];if(ok)s++;beep(ok?800:180);document.querySelector('.obj').classList.add(c[2]);res.className='result '+(ok?'good':'bad');res.textContent=ok?'Great prediction!':`It will ${c[2]}.`;r++;document.querySelector('.score').textContent=s+' / 5';setTimeout(next,1000)});next()}
function space(){shell('Space Runner','Drag the rocket to catch stars',`<div class="stage" id=sp style="background:linear-gradient(#071333,#172f7b)"><div class=piece id=rocket style="left:45%;top:72%;font-size:72px">🚀</div></div><div class=note>Catch 8 stars to finish. Avoid ☄️.</div>`,'⭐ 0');let st=document.getElementById('sp'),r=document.getElementById('rocket'),n=0,t=setInterval(()=>{let x=document.createElement('div');x.className='stick';x.textContent=Math.random()>.2?'⭐':'☄️';x.style.left=Math.random()*88+'%';x.style.top='-10px';st.appendChild(x);let y=-10,iv=setInterval(()=>{y+=8;x.style.top=y+'px';let a=x.getBoundingClientRect(),b=r.getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){if(x.textContent==='⭐'){n++;beep(800)}else{n=Math.max(0,n-1);beep(180)}document.querySelector('.score').textContent='⭐ '+n;x.remove();clearInterval(iv);if(n>=8){clearInterval(t);win('space',3);setTimeout(space,1200)}}if(y>st.clientHeight){x.remove();clearInterval(iv)}},45)},650);drag(r,st);clean=()=>clearInterval(t)}
function dino(){let bones=new Set;while(bones.size<7)bones.add(Math.floor(Math.random()*36));let n=0;shell('Dino Excavator','Tap sand to uncover 7 bones',`<div class=dig>${Array.from({length:36},(_,i)=>`<button class=tile data-i=${i}>🏜️</button>`).join('')}</div>`,'🦴 0 / 7');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(b.classList.contains('dug'))return;b.classList.add('dug');if(bones.has(+b.dataset.i)){b.textContent='🦴';n++;beep(850)}else b.textContent='·';document.querySelector('.score').textContent=`🦴 ${n} / 7`;if(n===7){win('dino',3);setTimeout(dino,1200)}})}
function build(){let n=0;shell('Build a House','Add pieces and drag them',`<div class=tools>${['🧱','🚪','🪟','🔺','🌳','🌻','🛝'].map(x=>`<button class=tool>${x}</button>`).join('')}</div><div class=stage id=lot></div><p class=choices><button class="choice green" id=done>✅ Finish</button></p>`,'🧱 0');let lot=document.getElementById('lot');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let e=document.createElement('div');e.className='piece';e.textContent=b.textContent;e.style.left=10+Math.random()*70+'%';e.style.top=15+Math.random()*65+'%';lot.appendChild(e);drag(e,lot);n++;document.querySelector('.score').textContent='🧱 '+n;beep(700)});done.onclick=()=>n<3?toast('Add at least 3 pieces'):win('build',n>6?3:2)}

function stick(){let n=0;shell('Sticker Scene','Tap stickers, then drag them',`<div class=tools>${['🌈','☀️','🦕','🚗','🌳','🌼','⚽','🦋','🚀','⭐'].map(x=>`<button class=tool>${x}</button>`).join('')}</div><div class=stage id=scene><div style="position:absolute;bottom:10%;left:8%;font-size:85px">🏕️</div></div><p class=choices><button class="choice green" id=sd>✅ Done</button></p>`,'✨ 0');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let e=document.createElement('div');e.className='stick';e.textContent=b.textContent;e.style.left=30+Math.random()*50+'%';e.style.top=20+Math.random()*55+'%';scene.appendChild(e);drag(e,scene);n++;document.querySelector('.score').textContent='✨ '+n});sd.onclick=()=>n<3?toast('Add 3 stickers first'):win('stick',n>7?3:2)}
function trace(){let l=['A','B','C'],i=0,n=0,on=0,last;shell('Letter Tracing','Trace the big dotted letter',`<canvas id=tr></canvas><p class=choices><button class=choice id=nx>Next ➜</button></p>`,'A · 0%');let c=tr.getContext('2d');function draw(){tr.width=tr.clientWidth*devicePixelRatio;tr.height=tr.clientHeight*devicePixelRatio;c.scale(devicePixelRatio,devicePixelRatio);c.fillStyle='#fff';c.fillRect(0,0,tr.clientWidth,tr.clientHeight);c.font=`900 ${Math.min(320,tr.clientWidth*.6)}px Arial`;c.textAlign='center';c.textBaseline='middle';c.setLineDash([4,17]);c.lineWidth=16;c.strokeStyle='#bddbe8';c.strokeText(l[i],tr.clientWidth/2,tr.clientHeight/2);c.setLineDash([])}draw();let p=e=>{let r=tr.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};tr.onpointerdown=e=>{on=1;last=p(e)};tr.onpointermove=e=>{if(!on)return;let q=p(e);c.strokeStyle='#ff8622';c.lineWidth=20;c.lineCap='round';c.beginPath();c.moveTo(...last);c.lineTo(...q);c.stroke();last=q;n=Math.min(100,n+1.6);document.querySelector('.score').textContent=`${l[i]} · ${n|0}%`};tr.onpointerup=()=>on=0;nx.onclick=()=>{if(n<35)return toast('Trace a little more!');i++;n=0;if(i===3){win('trace',3);i=0}draw();document.querySelector('.score').textContent=`${l[i]} · 0%`}}
function count(){let r=0,s=0,a,icons=['🍎','⭐','🚗','🦋'];shell('Counting','How many can you see?',`<div class=count id=cnt></div><div class=nums>${Array.from({length:10},(_,i)=>`<button class=num>${i+1}</button>`).join('')}</div><div class=result id=cr>Count carefully!</div>`,'0 / 5');function next(){if(r===5){win('count',s>3?3:2);return setTimeout(count,1200)}a=1+Math.floor(Math.random()*10);cnt.innerHTML=Array.from({length:a},()=>icons[Math.floor(Math.random()*icons.length)]).map(x=>`<span>${x}</span>`).join('')}document.querySelectorAll('.num').forEach(b=>b.onclick=()=>{let ok=+b.textContent===a;if(ok)s++;cr.className='result '+(ok?'good':'bad');cr.textContent=ok?'Correct!':`There are ${a}.`;r++;document.querySelector('.score').textContent=s+' / 5';setTimeout(next,700)});next()}
function sort(){let left=8;let types=['circle','square','triangle','diamond','circle','square','triangle','diamond'];shell('Shape Sorting','Drag shapes into matching baskets',`<div class=shapeRow>${types.map((x,i)=>`<div class="shape ${x}" data-s=${x}></div>`).join('')}</div><div class=bins>${[['circle','●'],['square','■'],['triangle','▲'],['diamond','◆']].map(x=>`<div class=bin data-b=${x[0]}>${x[1]}</div>`).join('')}</div>`,'8 left');document.querySelectorAll('.shape').forEach(e=>{let on=0,ox,oy;e.onpointerdown=q=>{on=1;e.setPointerCapture(q.pointerId);let r=e.getBoundingClientRect();ox=q.clientX-r.left;oy=q.clientY-r.top;e.style.position='fixed';e.style.zIndex=5};e.onpointermove=q=>{if(on){e.style.left=q.clientX-ox+'px';e.style.top=q.clientY-oy+'px'}};e.onpointerup=q=>{on=0;let b=[...document.querySelectorAll('.bin')].find(x=>{let r=x.getBoundingClientRect();return q.clientX>r.left&&q.clientX<r.right&&q.clientY>r.top&&q.clientY<r.bottom});if(b&&b.dataset.b===e.dataset.s){e.remove();left--;document.querySelector('.score').textContent=left+' left';beep(800);if(!left){win('sort',3);setTimeout(sort,1200)}}else{e.style.position='';e.style.left='';e.style.top='';e.style.zIndex=''}}})}
function music(){let fs=[262,294,330,349,392,440,494,523],n=0;shell('Music Maker','Play keys and drums',`<div class=keys>${fs.map((_,i)=>`<button class=key data-k=${i}></button>`).join('')}</div><div class=drums>${['🥁','🪘','🔔','👏'].map((x,i)=>`<button class=drum data-d=${i}>${x}</button>`).join('')}</div><p class=choices><button class="choice green" id=md>⭐ Finish song</button></p>`,'🎵 0');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{beep(fs[+b.dataset.k]);n++;document.querySelector('.score').textContent='🎵 '+n});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{beep(110+70*+b.dataset.d);n++;document.querySelector('.score').textContent='🎵 '+n});md.onclick=()=>n<6?toast('Play 6 notes first'):win('music',n>15?3:2)}
function drive(){let n=0;shell('Vehicle Sandbox','Drive through the play world',`<div class=stage id=road><div class=piece id=car style="left:10%;top:65%;font-size:72px">🚙</div>${['⭐','🌳','⭐','🚧','⭐'].map((x,i)=>`<div class=stick style="left:${25+i*14}%;top:${i%2?45:60}%">${x}</div>`).join('')}</div><p class=choices><button class=choice id=left>⬅️</button><button class="choice orange" id=jump>⬆️ JUMP</button><button class=choice id=right>➡️</button><button class="choice green" id=finish>🏁 FINISH</button></p>`,'⭐ 0');let x=10,y=65;function mv(dx,dy=0){x=Math.max(0,Math.min(88,x+dx));y=Math.max(15,Math.min(72,y+dy));car.style.left=x+'%';car.style.top=y+'%';document.querySelectorAll('#road .stick').forEach(e=>{let a=e.getBoundingClientRect(),b=car.getBoundingClientRect();if(e.textContent==='⭐'&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){e.textContent='✨';n++;beep(850);document.querySelector('.score').textContent='⭐ '+n}})}left.onclick=()=>mv(-6);right.onclick=()=>mv(6);jump.onclick=()=>{mv(0,-18);setTimeout(()=>mv(0,18),350)};finish.onclick=()=>win('drive',n===3?3:2)}
function roll(){let it=[['⚽','roll'],['🧱','slide'],['🛞','roll'],['📕','slide'],['🍊','roll']],r=0,s=0,c;shell('Roll or Slide','Predict how it moves',`<div class=stage id=ramp><div id=ro style="font-size:90px;position:absolute;left:22%;top:28%;transition:1s"></div><div style="position:absolute;width:70%;height:30px;background:#8e663b;left:15%;top:50%;transform:rotate(17deg);border-radius:20px"></div></div><div class=choices><button class=choice data-r=roll>🔄 ROLL</button><button class="choice orange" data-r=slide>➡️ SLIDE</button></div><div class=result id=rr>What do you think?</div>`,'0 / 5');function next(){if(r===5){win('roll',s>3?3:2);return setTimeout(roll,1200)}c=it[Math.floor(Math.random()*it.length)];ro.textContent=c[0];ro.style.left='22%';ro.style.top='28%';ro.style.transform='none'}document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let ok=b.dataset.r===c[1];if(ok)s++;rr.className='result '+(ok?'good':'bad');rr.textContent=ok?'Great prediction!':`It will ${c[1]}.`;ro.style.left='72%';ro.style.top='55%';ro.style.transform=c[1]==='roll'?'rotate(720deg)':'rotate(10deg)';r++;document.querySelector('.score').textContent=s+' / 5';setTimeout(next,1000)});next()}
function watchRoom(){A.innerHTML=`<main class=screen>${top()}${head('Watch & Discover','Original prototype learning shorts')}<section class=section><div class=watch>${[['🚀','Space Discovery'],['🦖','Fossil Detective'],['🚜','Amazing Vehicles']].map(x=>`<button data-v=${x[1]}><div class=thumb>${x[0]} ▶️</div><p>${x[1]}</p></button>`).join('')}</div></section></main>`;wireTop();wireBack();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let m=modal(`<div style="font-size:90px">✨</div><h2>${b.dataset.v}</h2><p>Explore, ask questions, and try the matching activity in the Play section.</p>`);S.stars++;save()})}
function callRoom(){A.innerHTML=`<main class=screen>${head('Curio Call','A playful simulated explorer call')}<div class=phone><h2 id=ct>Explorer is calling…</h2><div class=avatar>🧑‍🔬</div><p id=cl>Tap green to answer.</p><button class=callbtn style="background:#e84552" id=hang>📵</button><button class=callbtn style="background:#31ba62" id=ans>📞</button></div></main>`;wireBack();let lines=['Hi, explorer! Ready for a challenge?','Can you find something BLUE near you?','Now wiggle your fingers five times!','Amazing! You are a super explorer today!'],i=0;ans.onclick=()=>{if(i<lines.length){cl.textContent=lines[i++];beep(700)}else{win('call',1);cl.textContent='Call complete — ⭐ earned!'}};hang.onclick=()=>go(home)}
function parentsRoom(){A.innerHTML=`<main class=screen>${top()}${head('Parent Area','Local prototype settings')}<section class=play><h2>Progress</h2><p>⭐ ${S.stars} total stars</p><p>🏆 ${S.un.length} collectibles unlocked</p><p>🔊 Sound is ${S.sound?'on':'off'}</p><div class=choices><button class="choice orange" id=reset>Reset progress</button></div></section></main>`;wireTop();wireBack();reset.onclick=()=>{S={stars:0,gift:'',un:[0,1,2],hi:{},sound:true};save();parentsRoom()}}
home()})();
</script></body></html>
